name: Build & Publish
on: push

jobs:
  build_typst_documents:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Typst
        uses: lvignoli/typst-action@main
        with:
          source_file: main.typ
          
      - name: Create Pages directory
        run: |
          mkdir -p _site
          cp main.pdf _site/cv-jakubdupak.pdf
          echo '<html><head><meta http-equiv="refresh" content="0; url=cv-jakubdupak.pdf"></head></html>' > _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
